# Actions 탭의 버튼으로 개발 서버를 켜고 끄기 + 결과를 Discord로 알림
# 켤 때는 앱(gateway)이 손님을 받을 준비가 될 때까지 기다렸다가 "사용 가능"을 알려 줌
# 밤 12시 자동 정지(EventBridge)는 그대로 둠. 이 버튼은 그 전에 끄거나 다시 켤 때 씀
name: server

on:
  workflow_dispatch:
    inputs:
      action:
        description: "무엇을 할까요?"
        type: choice
        options: [start, stop, status]
        default: start

permissions:
  contents: read
  id-token: write                # OIDC로 AWS 역할 빌리기

concurrency: server              # 켜기·끄기가 동시에 겹치지 않게

env:
  INSTANCE_ID: ${{ vars.INSTANCE_ID }}
  ACTION: ${{ inputs.action }}

jobs:
  power:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: AWS 역할 빌리기 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: 켜기 / 끄기 / 상태 보기
        id: run
        run: |
          state() { aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' --output text; }

          case "$ACTION" in
            start)
              aws ec2 start-instances --instance-ids "$INSTANCE_ID" > /dev/null
              aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
              echo "EC2 running. 앱이 준비될 때까지 기다리는 중..."

              # SSM 에이전트가 붙을 때까지 다시 시도하면서, k3s 안의 gateway가 Ready가 될 때까지 기다림
              for i in $(seq 1 20); do
                CMD_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
                  --document-name AWS-RunShellScript \
                  --parameters 'commands=["k3s kubectl -n tollgate rollout status deployment/gateway --timeout=240s"]' \
                  --query Command.CommandId --output text 2>/dev/null) && break
                sleep 15
              done
              [ -n "$CMD_ID" ] || { echo "SSM 연결 실패"; exit 1; }

              for i in $(seq 1 60); do
                STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
                  --query Status --output text 2>/dev/null || echo Pending)
                case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
              done
              [ "$STATUS" = "Success" ] || { echo "gateway 준비 실패: $STATUS"; exit 1; }
              MSG="🟢 개발 서버 켜짐, gateway 사용 가능 (밤 12시 자동 정지)"
              ;;
            stop)
              aws ec2 stop-instances --instance-ids "$INSTANCE_ID" > /dev/null
              aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"
              MSG="⚫ 개발 서버 꺼짐"
              ;;
            status)
              MSG="ℹ️ 개발 서버 상태: $(state)"
              ;;
          esac
          echo "$MSG"
          echo "msg=$MSG" >> "$GITHUB_OUTPUT"

      - name: Discord 알림
        if: always()                # 실패해도 알림은 보냄
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_DEPLOY }}
          MSG: ${{ steps.run.outputs.msg }}
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ "$RESULT" = "success" ] || MSG="🔴 서버 $ACTION 실패"
          TEXT="$MSG
          누른 사람: ${{ github.actor }} · [실행 기록]($RUN_URL)"
          jq -n --arg c "$TEXT" '{content: $c}' | curl -sf -H 'Content-Type: application/json' -d @- "$WEBHOOK"
