# MySQL 백업: 매일 23시(서울) mysqldump → S3 (llm-tollgate-backup-c3b2ea/mysql/)
# 구조: initContainer(mysql 이미지)가 덤프를 공유 폴더에 쓰고 → container(aws-cli)가 S3로 올림
#       이미지 하나에 mysqldump와 aws를 같이 넣은 커스텀 이미지를 만들지 않으려고 두 칸으로 나눔
# 키 없음: aws-cli는 EC2 역할(IMDSv2 hop 2)로 S3에 올림. 권한은 infra/modules/backup
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mysql-backup
  namespace: tollgate
spec:
  schedule: "0 23 * * *"
  timeZone: Asia/Seoul
  # 서버는 쓸 때만 켜서 23시에 꺼져 있을 수 있음 → 2일 안에 놓친 백업은 다음에 켜질 때 한 번 실행
  startingDeadlineSeconds: 172800
  concurrencyPolicy: Forbid # 이전 백업이 아직 돌고 있으면 겹쳐 돌리지 않음
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2 # 실패하면 2번까지 다시 시도
      activeDeadlineSeconds: 600 # 10분 넘게 걸리면 실패로 처리 (멈춰서 계속 도는 것 방지)
      template:
        metadata:
          labels:
            app: mysql-backup
        spec:
          restartPolicy: Never
          enableServiceLinks: false # REDIS_PORT 사건과 같은 자동 환경 변수 충돌 방지
          volumes:
            - name: dump
              emptyDir: {} # Pod가 끝나면 사라지는 임시 공유 폴더
          initContainers:
            - name: dump
              image: mysql:8.4 # DB와 같은 버전의 mysqldump
              command: ["sh", "-c"]
              args:
                - |
                  set -e
                  F=/dump/tollgate-$(date -u +%Y%m%d-%H%M%S)Z.sql
                  # --single-transaction: 테이블을 잠그지 않고 한 시점 기준으로 뜸 (InnoDB). 서비스 중에도 안전
                  mysqldump -h mysql -u root --single-transaction --routines --triggers \
                    --no-tablespaces --databases tollgate > "$F"
                  # 덤프가 중간에 끊기지 않았는지 확인: 정상 덤프는 마지막 줄이 "-- Dump completed"
                  tail -1 "$F" | grep -q "Dump completed"
                  ls -l "$F"
              env:
                - name: MYSQL_PWD # 비밀번호를 명령줄에 안 쓰고 환경 변수로 (ps에 안 보이게)
                  valueFrom:
                    secretKeyRef:
                      name: mysql-secret
                      key: root-password
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
              volumeMounts:
                - name: dump
                  mountPath: /dump
          containers:
            - name: upload
              image: amazon/aws-cli:2.17.0
              command: ["sh", "-c"]
              args:
                - |
                  set -e
                  aws s3 cp /dump/ "s3://$BUCKET/mysql/" --recursive
                  echo "최근 백업:"; aws s3 ls "s3://$BUCKET/mysql/" | tail -3
              env:
                - name: BUCKET
                  value: llm-tollgate-backup-c3b2ea
                - name: AWS_DEFAULT_REGION
                  value: ap-northeast-2
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
              volumeMounts:
                - name: dump
                  mountPath: /dump
