server:
  port: 9090

spring:
  application:
    name: llm-tollgate-fake-llm
  mvc:
    async:
      request-timeout: 120s   # #stall 재현 시간보다 길게

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

fake-llm:
  first-token-delay: ${FAKE_LLM_FIRST_TOKEN_DELAY:300ms}
  chunk-delay: ${FAKE_LLM_CHUNK_DELAY:50ms}
  chunks: ${FAKE_LLM_CHUNKS:20}
  tokens-per-chunk: ${FAKE_LLM_TOKENS_PER_CHUNK:5}
  stall-duration: ${FAKE_LLM_STALL_DURATION:60s}
