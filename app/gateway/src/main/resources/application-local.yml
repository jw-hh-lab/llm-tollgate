# 노트북에서 MySQL·Docker 없이 바로 띄우는 설정. 실행: ./gradlew :gateway:bootRun --args='--spring.profiles.active=local'
spring:
  datasource:
    url: jdbc:h2:file:./build/localdb/tollgate;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE
    username: sa
    password:

tollgate:
  admin-token: local-admin
  llm:
    gemini:
      base-url: http://localhost:9090   # fake-llm 모듈
      api-key: fake
