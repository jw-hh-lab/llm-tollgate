# 공통 설정. 환경마다 달라지는 값은 환경 변수로 받는다 (목록은 README "설정값 목록")
server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: llm-tollgate-gateway
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: false   # 4~5주차 스트리밍 작업 때 켜고 k6로 전후 비교
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tollgate}
    username: ${DB_USERNAME:tollgate}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true

management:
  server:
    port: 8081           # 11/9 회의: 앱 8080, 관리용 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true    # /actuator/health/liveness, /actuator/health/readiness
      group:
        readiness:
          include: readinessState,db   # LLM은 헬스체크에서 뺀다 (외부 장애로 Pod가 재시작되면 안 됨)

tollgate:
  admin-token: ${ADMIN_TOKEN:}
  llm:
    # 1순위 모델: gemini-3.1-flash-lite (2026-11-20 확정, 종완 동의)
    # 3.8-flash는 11/17 혼잡으로 무응답이었고 2027-01-01부터 단가가 두 배. 품질이 부족하면 이 값만 바꾼다
    primary-model: ${LLM_PRIMARY_MODEL:gemini-3.1-flash-lite}
    connect-timeout: 5s
    first-token-timeout: ${LLM_FIRST_TOKEN_TIMEOUT:10s}
    idle-timeout: ${LLM_IDLE_TIMEOUT:15s}
    default-max-tokens: 1024
    max-tokens-limit: 4096
    gemini:
      # 가짜 LLM 서버로 바꿀 때는 이 주소만 바꾼다 (예: http://fake-llm:9090)
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      api-key: ${GEMINI_API_KEY:}
      thinking-budget: 0   # 생각(thinking) 토큰을 끄면 첫 토큰이 빨라지고 비용이 줄어든다
  pricing:
    # 1크레딧 = $0.0001 (2026-11-20 확정). 단위: 100만 토큰당 크레딧, 원가 그대로(마진 없음)
    # 출처: Google AI Studio 가격표(유료 등급 표준가, 출력에는 생각 토큰 포함), 2026-11-20 확인
    models:
      "[gemini-3.1-flash-lite]":   # $0.25 / $1.50
        input-per-million: 2500
        output-per-million: 15000
      "[gemini-3.8-flash]":        # $0.75 / $3.75 (2026-12-31까지). 2027-01-01부터 $1.50 / $7.50 → 15000 / 75000으로 바꿀 것
        input-per-million: 7500
        output-per-million: 37500
      "[nova-micro]":              # 예비 모델(7~8주차). $0.035 / $0.14 기준, AWS 가격표로 다시 확인할 것
        input-per-million: 350
        output-per-million: 1400
