# 공통 설정. 환경마다 달라지는 값은 환경 변수로 받는다 (목록은 README "설정값 목록")
server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: llm-tollgate-gateway
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: false   # 4~5주차 스트리밍 작업 때 켜고 k6로 전후 비교
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tollgate}
    username: ${DB_USERNAME:tollgate}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms          # Redis가 느리거나 죽어도 요청이 오래 막히지 않게 (사용량 제한·캐시는 건너뛰고 진행)
      connect-timeout: 500ms

management:
  server:
    port: 8081           # 11/9 회의: 앱 8080, 관리용 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true    # /actuator/health/liveness, /actuator/health/readiness
      group:
        readiness:
          include: readinessState,db   # LLM·Redis는 뺀다 (부가 기능 장애로 Pod가 빠지면 안 됨)

tollgate:
  admin-token: ${ADMIN_TOKEN:}
  redis:
    enabled: ${TOLLGATE_REDIS_ENABLED:true}   # false면 사용량 제한·캐시 없이 동작 (로컬·테스트)
    rate-limit:
      per-minute: ${RATE_LIMIT_PER_MINUTE:60}  # 고객별 분당 호출 수 (IP 단위 제한은 Nginx)
      per-day: ${RATE_LIMIT_PER_DAY:5000}      # 고객별 하루 호출 수 (UTC 날짜 기준)
    cache:
      ttl: 24h                                 # 11/9 회의 추천: 같은 질문은 하루 동안 같은 답
  llm:
    # gemini-2.5-flash는 새 사용자에게 막혀 있다(2026-11-17 확인, Google이 3.8-flash 사용을 안내)
    primary-model: ${LLM_PRIMARY_MODEL:gemini-3.8-flash}
    connect-timeout: 5s
    first-token-timeout: ${LLM_FIRST_TOKEN_TIMEOUT:10s}
    idle-timeout: ${LLM_IDLE_TIMEOUT:15s}
    default-max-tokens: 1024
    max-tokens-limit: 4096
    gemini:
      # 가짜 LLM 서버로 바꿀 때는 이 주소만 바꾼다 (예: http://fake-llm:9090)
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      api-key: ${GEMINI_API_KEY:}
      thinking-budget: 0   # 생각(thinking) 토큰을 끄면 첫 토큰이 빨라지고 비용이 줄어든다
  pricing:
    # 1크레딧 = $0.0001 가정(미정). 100만 토큰당 크레딧
    models:
      "[gemini-3.8-flash]":     # 단가 미확인. 2.5-flash 값을 임시로 씀 → Google 가격표 확인 후 수정
        input-per-million: 3000
        output-per-million: 25000
      "[gemini-2.5-flash]":
        input-per-million: 3000
        output-per-million: 25000
      "[nova-micro]":
        input-per-million: 350
        output-per-million: 1400
