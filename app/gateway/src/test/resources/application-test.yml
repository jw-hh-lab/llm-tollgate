spring:
  datasource:
    url: jdbc:h2:mem:tollgate-${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:

management:
  server:
    port: 0

tollgate:
  redis:
    enabled: false   # Redis 없이. Redis 기능 테스트는 RedisFeaturesTest에서 켠다
  admin-token: test-admin
  llm:
    first-token-timeout: 1s
    idle-timeout: 1s
    gemini:
      base-url: http://localhost:1   # 각 테스트에서 가짜 서버 주소로 덮어쓴다
      api-key: test-key
